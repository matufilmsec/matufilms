[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# --- Redirects de SEO: la landing y el diario se movieron de estructura ---
[[redirects]]
  from = "/diario.html"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/como-elegir-fotografo-de-bodas.html"
  to = "/blog/como-elegir-fotografo-de-bodas.html"
  status = 301
  force = true

[[redirects]]
  from = "/cuanto-cuesta-fotografo-bodas-cuenca.html"
  to = "/blog/cuanto-cuesta-fotografo-bodas-cuenca.html"
  status = 301
  force = true

[[redirects]]
  from = "/cuenca-destino-de-boda.html"
  to = "/blog/cuenca-destino-de-boda.html"
  status = 301
  force = true

[[redirects]]
  from = "/images/*"
  to = "/assets/img/:splat"
  status = 301
  force = true

# Enlaces personalizados de planes para prospectos: /p/CODIGO se sirve
# desde /plan/ (la URL no cambia). Sin indexar ni guardar en caché.
[[redirects]]
  from = "/p/*"
  to = "/plan/index.html"
  status = 200
  force = true

# Enlaces universales: /planes (tarifa A) ya se sirve desde /planes/;
# /propuesta (tarifa B) usa la misma página. Quien llega deja su nombre
# y WhatsApp y se crea su enlace personal /p/CODIGO automáticamente.
[[redirects]]
  from = "/propuesta"
  to = "/planes/index.html"
  status = 200
  force = true

# 404 personalizado
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/planes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/propuesta"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/seguimiento/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
