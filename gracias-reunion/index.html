<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Listo! Reunión agendada — MatuFilms</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#29241E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Italianno&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/global.css">

<!-- ============================================================
NOTA PARA ANDRÉS — configuración en Cal.com:
En el tipo de evento de la "reunión" (llamada de venta), en
"Redirect on booking", pon:
  https://matufilms.com/gracias-reunion/?uid={BOOKING_UID}
Así esta página recibe el uid de la reserva y puede deduplicar
correctamente con el evento que ya mandó cal-webhook.js.
============================================================= -->
</head>
<body data-mf-page="gracias-reunion">

<div class="topbar topbar-static">
<a href="/"><img class="logo" src="/assets/img/logo-ink.png" alt="MatuFilms"></a>
</div>

<section class="simple-page">
<div class="box">
<span class="eyebrow" style="text-align:center;">Reunión confirmada</span>
<h1>¡Listo! Agendamos tu reunión.</h1>
<p>Te llegará la confirmación por correo con el link de la videollamada. Si tienes alguna pregunta antes de la llamada, escríbenos por WhatsApp — respondemos en menos de 24h.</p>
<a class="btn" data-mf-event="contacto" data-mf-source="whatsapp" href="https://wa.me/593987638921?text=Hola%20MATU%2C%20acabo%20de%20agendar%20nuestra%20reuni%C3%B3n" target="_blank" rel="noopener">
<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.51 2 12.05 2h-.01zm5.83 14.14c-.24.68-1.4 1.3-1.93 1.35-.5.05-1.02.24-3.4-.71-2.88-1.15-4.73-4.07-4.87-4.26-.14-.19-1.17-1.55-1.17-2.96s.72-2.1.98-2.39c.25-.28.55-.35.74-.35.19 0 .37 0 .53.01.17.01.4-.06.62.48.24.58.81 1.99.88 2.13.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.16-.29.36-.42.48-.14.14-.28.29-.12.56.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.28.14.44.12.6-.07.17-.19.71-.83.9-1.11.19-.28.38-.24.63-.14.26.09 1.65.78 1.94.92.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
Escríbenos por WhatsApp
</a>
</div>
</section>

<footer class="site-footer">
<img class="logo" src="/assets/img/logo-ivory.png" alt="MatuFilms">
<div class="legal">© <span id="year"></span> MatuFilms.</div>
</footer>

<script src="/assets/js/ui.js"></script>
<script src="/assets/js/tracking.js"></script>
<script>
// Dispara "Cliente potencial" (Lead) y "Contacto" del lado del navegador,
// usando el uid de la reserva de Cal como refId + eventId, para que
// Meta deduplique este disparo con el que ya mandó cal-webhook.js.
(function () {
  var uid = new URLSearchParams(window.location.search).get("uid") || "sin-uid";
  document.addEventListener("DOMContentLoaded", function () {
    window.MF.track("cliente_potencial", { refId: uid, eventId: "cal_reunion_" + uid, contentName: "Reunión / llamada de venta" });
    window.MF.track("contacto", { refId: uid + "_thankyou_reunion", source: "thankyou_reunion" });
  });
})();
</script>
</body>
</html>
